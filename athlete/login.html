<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Athlete Login — K3B Sports</title>
  <link rel="stylesheet" href="/css/global.css">
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; }
    .login-wrap {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 40px 24px;
    }
    .login-card {
      width: 100%; max-width: 420px;
      background: var(--dark); border: 1px solid var(--border-gold);
      padding: 48px 40px; position: relative;
    }
    .login-card::before {
      content: ''; position: absolute; top: 0; left: 0;
      width: 48px; height: 3px; background: var(--gold);
    }
    .login-logo {
      font-family: var(--font-display); font-size: 20px;
      letter-spacing: 4px; color: var(--gold); margin-bottom: 32px;
    }
    .login-title {
      font-family: var(--font-display); font-size: 36px;
      letter-spacing: 2px; margin-bottom: 8px;
    }
    .login-sub {
      font-size: 13px; color: var(--text-muted); margin-bottom: 36px;
    }
    .login-footer {
      margin-top: 24px; font-size: 12px; color: var(--text-dim);
      text-align: center;
    }
    .login-footer a { color: var(--gold); }
    .error-msg {
      background: rgba(244,67,54,0.08); border: 1px solid rgba(244,67,54,0.25);
      padding: 12px 16px; font-size: 12px; color: var(--danger);
      margin-bottom: 20px; display: none;
    }
    .error-msg.show { display: block; }
  </style>
</head>
<body>
<nav class="nav">
  <a href="/index.html" class="nav-logo">
    <div class="nav-logo-mark">K3B</div>
    K3B SPORTS
  </a>
</nav>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">K3B Sports</div>
    <h1 class="login-title">Athlete<br>Login</h1>
    <p class="login-sub">Access your portal to track your application.</p>

    <div class="error-msg" id="errorMsg">Invalid email or password. Please try again.</div>

    <div class="form-group">
      <label class="form-label">Email Address</label>
      <input class="form-input" type="email" id="emailInput" placeholder="you@email.com" onkeydown="if(event.key==='Enter') login()">
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input class="form-input" type="password" id="passwordInput" placeholder="Your password" onkeydown="if(event.key==='Enter') login()">
    </div>
    <button class="btn btn-gold btn-full" style="margin-top:8px;" onclick="login()">Sign In →</button>

    <div class="login-footer">
      Don't have an account? <a href="/pages/assessment.html">Take the Assessment</a>
    </div>
  </div>
</div>

<script src="/js/k3b.js"></script>
<script>
K3B.seed.demoAthletes();

if (K3B.auth.isAthleteLoggedIn()) {
  window.location.href = '/athlete/portal.html';
}

function login() {
  const email = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('passwordInput').value;
  document.getElementById('errorMsg').classList.remove('show');

  const athlete = K3B.athletes.getByEmail(email);
  if (!athlete || athlete.password !== password) {
    document.getElementById('errorMsg').classList.add('show');
    return;
  }
  K3B.auth.loginAthlete({ id: athlete.id, firstName: athlete.firstName, lastName: athlete.lastName, email: athlete.email, sport: athlete.sport, level: athlete.level });
  window.location.href = '/athlete/portal.html';
}
</script>
</body>
</html>
